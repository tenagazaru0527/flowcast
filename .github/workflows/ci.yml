name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Core tests
        run: node --test test/core.test.js

      - name: Acceptance criteria report
        continue-on-error: true
        run: node test/acceptance.test.js

      - name: Verify runtime hashes
        run: node scripts/check-runtime-hashes.js
